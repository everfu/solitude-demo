### Basic configuration

# --------------------------- start ---------------------------
# Site information
# 网站信息
site: &v4_site
  name:
    class: text # text / i_class / img
    custom: Solitude # Solitude / fas fa-ghost / /img/pwa/favicon.ico
  icon: /img/logo.png # Site icon / 网站图标
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Navigation bar
# 导航栏
nav: &v4_nav
  # Left Box
  # 左侧盒子
  group:
    项目:
      Solitude: https://github.com/everfu/hexo-theme-solitude || /solitude-demo/img/logo.png # name: url || icon

  # Menu
  # 菜单
  menu:
    # 首页: / # name: link
    文库: # name
      全部文章: /archives/ || fas fa-folder-closed # item name: link || icon
      全部分类: /categories/ || fas fa-clone
      全部标签: /tags/ || fas fa-tags
    友链:
      友情链接: /links/ || fas fa-link
      宝藏博主: javascript:travelling() || fas fa-gift
    我的:
      我的装备: /kit/ || fas fa-cogs
      关于本站: /about/ || fas fa-user

  # Right button
  # 右侧按钮
  right:
    random: true # Random article / 随机文章按钮
    custom:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Home Top Banner
# 首页顶部
hometop: &v4_hometop
  enable: true
  banner:
    title: 分享技术<br >与科技生活
    desc: 产品、设计、开发、运营
    icon:
      HTML: # 名称
        icon: "fab fa-html5"
        color: "#e9572b" # 颜色
      JS:
        icon: "fab fa-js"
        color: "#f7cb4f"
      Docker:
        icon: "fab fa-docker"
        color: "#57b6e6"
      Flutter:
        icon: "fab fa-flutter"
        color: "#02569b"
      Git:
        icon: "fab fa-git"
        color: "#df5b40"
  group:
    # 热门: /tags/Hexo/ || fas fa-fire || linear-gradient(to right,#f65,#ffbf37)
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Aside
# 侧边栏
aside: &v4_aside
  # Values: about (info card), newestPost (latest article), allInfo (website information), newest_comment (latest comment)
  # 值: about(信息卡), newestPost(最新文章), allInfo(网站信息), newest_comment(最新评论)

  # Sticky: Fixed position / noSticky: Not fixed position
  # Sticky: 固定位置 / noSticky: 不固定位置
  home: # on the homepage
    noSticky: "about,calendar,schedule"
    Sticky: "allInfo"
  post: # on the article page
    noSticky: "about"
    Sticky: "newestPost"
  page: # on the page
    noSticky: "about"
    Sticky: "newestPost,allInfo"
  # 菜单栏位置(0: 左 1: 右)
  position: 1 # Sidebar positioning(0: left 1: right)

  # --------------------------- start ---------------------------
  # Information card
  # 信息卡
  my_card:
    author:
      img: https://github.com/everfu.png
      sticker: # url, 24x24 size
    description: 只有迎风，风筝才能飞得更高。
    # 内容 / Content
    content: 这是一个普通的程序员，但有一个不平凡的梦想，希望能够改变世界。
    state:
      morning: ✨ 早上好，新的一天开始了
      noon: 🍲 午餐时间
      afternoon: 🌞 下午好
      night: 早点休息
      goodnight: 晚安 😴
    witty_words:
      - 人生没有白走的路，每一步都算数。
      - 是金子总会发光，是石头总会碰撞。
      - 我们都是孤独的旅行者。
    # social
    # 社交信息图标
    information:
      Github: https://github.com/everfu || fab fa-github # Name: link || icon
      Bsky: https://bsky.app/profile/efu.me || fab fa-bluesky
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # article table of contents
  # 文章目录
  toc:
    post: true
    page: false
    vague: true
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # Tags
  # 标签
  tags:
    enable: true
    limit: 20 # Number of tags displayed
    # Highlighted tags
    highlight_list:
      # - Hexo
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # Site Info
  # 网站信息
  siteinfo:
    # Number of articles
    # 文章数量
    postcount: true
    # Total number of words
    # 总字数
    wordcount: true
    # PV
    pv: true
    # UV
    uv: true
    # Last update date
    # 最后更新日期
    updatetime: true
    # Website creation time
    # 网站创建时间
    runtimeenable: true
    # Format: yyyy-MM-dd hh-mm-ss
    # 格式: yyyy-MM-dd hh-mm-ss
    runtime: "2023-04-20 00:00:00"
  # --------------------------- end ---------------------------
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Page default settings
# 页面默认设置
page: &v4_page
  # 404 page
  # 404 页面
  error: true
  # Tags page
  # 标签页面
  tags: true
  # Categories page
  # 分类页面
  categories: true
  # list: Sort List / 1: Follow HomeList
  # list: 排序列表 / 1: 跟随首页列表
  archives: 0
  # 友链总数超过此值时通过 JSON 异步加载
  links:
    async_threshold: 200
  # Default value
  # 默认值
  default:
    # Default image when no cover is set
    # 未设置封面时的默认图片
    cover:
      # - /img/default.png # 默认图片 / default cover
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Post default settings
# 文章默认设置
post: &v4_post
  default:
    # Default image when no cover is set
    # 未设置封面时的默认图片
    cover:
      # -  # 默认图片 / default cover
    # Location
    # 位置
    locate: 中国
    # Copyright
    # 版权
    copyright:
      enable: false
      author: /img/logo.png
      # License
      # 许可证
      license: CC BY-NC-SA 4.0
      # License link
      # 许可证链接
      licenurl: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans
  ai:
    enable: true
    modelName: 小七 GPT
  # Article meta information
  # 文章元信息
  meta:
    # Release date
    # 发布日期
    date: true
    # Update date
    # 更新日期
    updated: true
    # Location
    # 位置
    locate: true
    # Number of words
    # 字数
    wordcount: true
    # uv
    readtime: true
    # pv
    pv: true
    # Comment count
    # 评论数
    comment: false
  # Reward
  # 打赏
  award:
    enable: false
    appreciators: /about/ # Reward page
    # Reward Title
    # 打赏标题
    title: # Thanks for your appreciation. / 感谢您的赞赏
    desc: # Because of your support, I realize the value of writing articles. / 由于您的支持，我才能够实现写作的价值。
    # Reward list
    # 打赏列表
    list:
      # - name: Github Sponsor
      #   qcode: https://s3.qjqq.cn/47/661ba900c4bc1.webp!color
      #   url: https://github.com/sponsors/everfu
      #   color: var(--efu-black)

  # Share icon
  # 分享图标
  share:
    enable: false
    list:
      # - qq
      # - weibo
      # - twitter
      # - facebook
      # - telegram
      # - whatsapp
      # - linkedin
      # - link
      # - qrcode
  rss: # /atom.xml
  # Article reading progress
  # 文章封面取色
  covercolor:
    enable: true
    # local: local color / api: api color / ave: oss average color
    mode: local
    # api address / api 地址
    api: https://api.qjqq.cn/api/Imgcolor?img=
    # Storage / 缓存时间
    time: 43200000
  footer:
    enable: false
    desc: # Articles from Ever Fu. / 文章来自 Ever Fu # description
    button: # Button
      enable: true
      name: # Learn more / 了解更多
      url: /about/
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Custom Theme Color
theme_color: &v4_theme_color
  dark: "#3498db" # 深蓝色
  light: "#f1c40f" # 阳光黄
  nav_hover_text:
    dark: "#1b1c20" # 深色模式导航栏悬停文字
    light: "#363636" # 浅色模式导航栏悬停文字
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# display mode
# 显示模式
display_mode: &v4_display_mode
  # auto: automatic switching(Recognize the current theme mode of the device) / dark: dark mode / light: light mode
  # auto: 自动切换（识别设备当前主题模式） / dark: 深色模式 / light: 浅色模式
  type: auto
  # After opening, the dark mode will display the starry sky background
  # 开启后深色模式会显示星空背景
  universe: false
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Font
# 字体
font: &v4_font
  font-size: 16px
  code-font-size: 16px
  # Global font
  # 全局字体
  font-family: "PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
  # Code font
  # 代码字体
  code-font-family: '"monospace", monospace'
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lure
# When the user exits the page, modify the title
# 当用户退出页面时，修改标题
lure: &v4_lure
  enable: false
  jump: 404 Not Found
  back: ヾ(≧∇≦*)ゝHey, hey, you fell for it.
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Article expiration
# 文章过期
expire: &v4_expire
  enable: false
  time: 30 # days
  position: top # top / bottom
  text_prev: "This article expired "
  text_next: " day ago, if the content does not match, please contact the webmaster to update it."
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Home page article configuration information
# 首页文章配置信息
index_post_list: &v4_index_post_list
  direction: column # row / column
  column: 2 # 2: 2 columns 3: 3 columns
  cover: both
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Related articles
# 相关文章
related_post: &v4_related_post
  enable: false
  limit: 2
  # created: release date / updated: update date
  # created: 发布日期 / updated: 更新日期
  date_type: created
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Custom right menu
# 自定义右键菜单
right_menu: &v4_right_menu
  enable: false
  # Whether to display the hot comment switch.
  # 是否显示热门评论开关
  commentBarrage: false
  # Whether to display the browser's context menu when hold Ctrl key.
  # 是否在按住 Ctrl 键时显示浏览器右键菜单
  ctrlOriginalMenu: false
  # Simplified and Traditional Chinese translation.
  # 简繁体转换
  translate: false
  # Custom list
  # 自定义列表
  custom_list:
    # - name: 随机文章
    #   click: toRandomPost()
    #   id: menu-randomPost
    #   class:
    #   icon: fas fa-tower-broadcast
    # - name: 全部分类
    #   click: pjax.loadUrl('/categories/') # External links with window.open, pjax can not request cross-domain content.
    #   id:
    #   class:
    #   icon: fas fa-clone
    # - name: 全部标签
    #   click: pjax.loadUrl('/tags/')
    #   id:
    #   class:
    #   icon: fas fa-tags
# --------------------------- end -----------------------

# --------------------------- start ---------------------------
# Copy
#  information
# 复制信息
copy: &v4_copy
  enable: true
  # Turn on Link copyright information after copying.
  # 复制后链接版权信息
  copyright:
    enable: false
    # Display when the number of words copied exceeds
    # 复制文字时超过多少字数显示
    limit: 50
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Mermaid
mermaid: &v4_mermaid false
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Chart.js
chart: &v4_chart true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# typeit
typeit: &v4_typeit true
# --------------------------- end ---------------------------

### Extended configuration

# --------------------------- start ---------------------------
# Console
# 控制台
console: &v4_console
  enable: true
  # Recent comments
  # 最新评论
  recentComment:
    enable: true
    # Cache time 1: 1 day / .5 : half a day
    # 缓存时间 1: 1天 / .5 : 半天
    storage: .2
  card:
    # Tags
    # 标签
    tags: true
    # Archives
    # 归档
    archive: month
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
translate: &v4_translate
  enable: true
  defaultEncoding: 2 # 1: 默认繁体 2: 默认简体
  translateDelay: 0 # 首次加载翻译迟疑时间
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Right-Sidebar
# 右下角悬停导航栏
rightside: &v4_rightside
  enable: true
  hide:
    enable: true
    translate: true
    mode: true
    aside: true
# --------------------------- start ---------------------------

# --------------------------- start ---------------------------
# Footer
# 页脚
footer: &v4_footer
  # 社交图标
  information:
    author: /solitude-demo/img/logo.png
    left:
      Github: https://github.com/everfu || fab fa-github # 名称: 链接 || 图标
      Bsky: https://bsky.app/profile/efu.me || fab fa-bluesky
      Mail: mailto:o@efu.me || far fa-envelope
    right:
      Bilibili: https://space.bilibili.com/1329819902 || fab fa-bilibili
      Twitter: https://twitter.com/everfu8 || fab fa-twitter
      Douyin: https://v.douyin.com/iJsLc8jt/ || fab fa-tiktok
  # 友情链接
  group:
    导航:
      全部文章: /archives/
      全部分类: /categories/
      全部标签: /tags/
    协议:
      Apache-2.0: https://www.apache.org/licenses/LICENSE-2.0.html
    友链:
      伍拾柒: https://www.efu.me/
      张洪Heo: https://zhheo.com/
      亦小封: https://meuicat.com/

  # 随机友链
  randomlink: true # 随机友链

  # 备案
  beian:
    # - name: 湘公网安备43048102000175号
    #   icon: https://beian.mps.gov.cn/img/logo01.dd7ff50e.png
    #   url: https://beian.mps.gov.cn/#/query/webSearch
    # - name: 湘ICP备2024080357号-1
    #   url: https://beian.miit.gov.cn/

  # 页脚信息文字
  # 请不要删除主题信息，这是对作者的尊重
  links:
    - name: 订阅
      url: /atom.xml
    - name: License
      url: https://github.com/everfu/hexo-theme-solitude/blob/main/LICENSE
      icon:
        - fas fa-copyright
        - fab fa-creative-commons-by
        - fab fa-creative-commons-nc
        - fab fa-creative-commons-nd
    # - name: boringbay
    #   url: https://boringbay.com/
    #   img: https://boringbay.com/api/badge/www.efu.me
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# 404 page
# 404 页面
errorpage: &v4_errorpage
  img: /img/404.avif
  text: =awa= Page Not Found # Text
  recommendList: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Meting API
# This part of the content uses metingjs,
# can only use NetEase Cloud Music, QQ Music and other music platforms supported by the mainland China region,
# the subsequent consideration of the use of JSON files to store music information and customize the implementation of the third-party API does not depend on the page.
# Music Page
meting_api: &v4_meting_api "https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id&r=:r" # Custom API
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Capsule music
# 音乐胶囊
capsule: &v4_capsule
  enable: true
  # 歌单 ID / 单曲 ID
  id: 8407304077
  # 服务商：netease / qq / xiami / kugou / baidu
  server: netease
  # 类型：playlist / song
  type: playlist
  volume: 0.8
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Quick Menu
# Open with shift + ?
# 快捷菜单
# 使用 shift + ? 打开
keyboard: &v4_keyboard
  enable: false
  list:
    # - name: 关闭快捷菜单
    #   key: K
    #   func: keyboard
    # - name: 打开控制台
    #   key: A
    #   sco: showConsole
    # - name: 播放/暂停音乐
    #   key: M
    #   sco: musicToggle
    # - name: 打开友链
    #   key: L
    #   url: /links/
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lazyload
# 图片懒加载
lazyload: &v4_lazyload
  enable: true
  # post, site
  field: site
  # 加载时替换图
  placeholder: ""
  # 加载失败替换图
  errorimg: /solitude-demo/img/error_load.avif
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Loading
# 加载
loading: &v4_loading
  # Full screen loading
  # 全屏加载
  fullpage: false
  # Loading icon, default is siteicon
  # 加载图标，不写默认siteicon
  favicon: /img/favicon.png
  # Pace loading
  # Pace 加载
  pace: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Highlight
# 代码块高亮
highlight: &v4_highlight
  enable: true
  # Display the fold button when the number of words exceeds
  # 当超过多少字时显示折叠按钮
  limit: 200
  # Whether to enable the copy button
  # 是否启用复制按钮
  copy: true
  # Whether to expand by default
  # 是否默认展开
  expand: true
  # default: default / mac : apple terminal
  # default: 默认 / mac : 苹果终端
  theme: mac
  # default / solidity / dracula
  color: default
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lightbox
# 图片灯箱
lightbox: &v4_lightbox true
# warning: Please select any one, but cannot be turned on at the same time.
# 警告: 请任选其一，但不能同时开启。
fancybox: &v4_fancybox true # fancybox
mediumZoom: &v4_medium_zoom false # mediumZoom
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Memorial
# Turn the entire site gray on memorable days.
# 在纪念日整个网站变灰
memorial: &v4_memorial
  enable: false
  date:
  #  - 7-7
  #  - 9-18
  #  - 12-13
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# OpenGraph
OpenGraph: &v4_open_graph
  enable: true
  options:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Word count
# 字数统计
# warning: Please install the hexo-wordcount plugin first.
# 警告: 请先安装 hexo-wordcount 插件。
wordcount: &v4_wordcount true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Katex
# Latex formula support
# Latex 公式支持
katex: &v4_katex
  enable: true
  # Whether to load on each page
  # 是否在每个页面加载
  per_page: true
  # Whether to enable copy formula
  # 是否启用复制公式
  copytex: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# verification
# 验证
verify_site: &v4_verify_site
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# CSS Prefix
# CSS 前缀
# When turned on, it will automatically prefix the CSS (to get better browser support), but this will increase the size of the CSS file.
# 开启后会自动给 CSS 加前缀（以获得更好的浏览器支持），但这会增加 CSS 文件的大小。
css_prefix: false
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Extend
# 扩展
extends: &v4_extends
  # Insert in head
  # 插入到 head
  head:
    - <link rel="stylesheet" href="https://everfu.github.io/solitude-demo/css/schedule.css">
  #  - <script src="https://cdn.bootcdn.net/ajax/libs/pace/1.2.4/pace.min.js"></script>

  # Insert in body
  # 插入到 body
  body:
    - <script src="https://everfu.github.io/solitude-demo/js/schedule.js"></script>
    - <script src="https://npm.akass.cn/chinese-lunar@0.1.4/lib/chinese-lunar.js"></script>
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# PWA
# Progressive Web App
pwa: &v4_pwa
  enable: false
  manifest: /manifest.json # manifest.json
  theme_color: "#006a73" # Theme color
  mask_icon: /img/pwa/favicon.png # Mask icon
  apple_touch_icon: /img/pwa/favicon.png # Apple touch icon
  bookmark_icon: /img/pwa/favicon.png # Bookmark icon
  favicon_32_32: /img/pwa/favicon_32.png # 32x32 icon
  favicon_16_16: /img/pwa/favicon_16.png # 16x16 icon
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Comment
# 评论
comment: &v4_comment
  # Which commenting system to use(e.g. waline or waline,twikoo)
  # 使用哪个评论系统（例如： waline or waline,twikoo）
  use: valine,giscus # waline, twikoo, valine, artalk, giscus # Up to two comment systems can be turned on at the same time
  # Whether to display the hot comment switch.
  # 是否显示热门评论开关
  commentBarrage: true
  # Lazy load
  # 懒加载评论区
  lazyload: false
  # Whether to display the comment count
  # 显示评论数
  count: true
  # Sidebar displays the total number of comments
  # Sidebar 显示总评论数
  sidebar: true
  # PV
  pv: true
  # Avatar
  avatar: https://weavatar.com
  # Hot comment tips
  # 热评提示
  hot_tip:
    enable: true
    # Number of hot comments
    count: 3
  # recent comments(⚠️ Comments need to be configured first.)
  # 最新评论(⚠️ 需要先配置评论)
  newest_comment:
    enable: true
    storage: .5 # 缓存时间 1: 1天 / .5 : 半天 / Cache time 1: 1 day .5 : half a day
    limit: 5 # 评论数 / Number of comments
# Twikoo: https://solitude.js.org/comment/twikoo
twikoo: &v4_twikoo # https://twikoo.js.org/
  envId: # url: https://twikoo.sondy.top/
  region: # Environment locale, default is ap-shanghai, Tencent cloud environment fill ap-shanghai or ap-guangzhou; Vercel environment do not fill the.
  style: true # Use custom styles when turned on
  accessToken: # AccessToken
  option: # twikoo option
# Waline: https://solitude.js.org/comment/waline
waline: &v4_waline # https://waline.js.org/
  envId: # url: https://waline.wzsco.top
  pageview: false # Whether to enable page access statistics
  option: # waline configuration item
# Valine: https://solitude.js.org/comment/valine
valine: &v4_valine
  appId: lUYWcy5GblLUZOCvcSdDiLP9-gzGzoHsz # leancloud application app id
  appKey: nKcAGPsR1ydwQjEFZcMFNGJG # leancloud application app key
  serverURLs: https://luywcy5g.lc-cn-n1-shared.com # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  avatar: https://weavatar.com/avatar/ # https://valine.js.org/avatar.html
  visitor: true
  style: true # Use custom styles when turned on
  option: # options list
# Artalk: https://solitude.js.org/comment/artalk
# Artalk: https://solitude.js.org/zh/comment/artalk
artalk: &v4_artalk
  server: # server url
  site: # site name
  option: # options
# Giscus: https://solitude.js.org/comment/giscus
giscus: &v4_giscus
  repo: 'everfu/solitude-demo' # GitHub repository name
  repo_id: 'R_kgDOPEVUMQ' # GitHub repository ID
  category_id: 'DIC_kwDOPEVUMc4CueyU' # GitHub repository category ID
  theme:
    light: light
    dark: dark
  option:
    'data-mapping': 'og:title'
    'data-lang': 'zh-CN'
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Search
search: &v4_search
  enable: true
  # type: 使用的搜索引擎 / search engine
  type: local # local / algolia
  tags:
    - 热门
    - Hexo
    - Swift
    - Sketch
    - 设计
    - 教程
  ai:
    enable: true
    url: https://ai.zhheo.com/
  algolia:
    # hits:
    #   per_page: 6
  local:
    preload: false
    CDN: /solitude-demo/search.xml
  docsearch:
    appId: "KNSYWJA80Y"
    apiKey: "64cec8b7ed869453640daca02f5911fc"
    indexName: "solitude-js"
    option:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Music Page
# 音乐馆
music: &v4_music
  enable: true
  # 歌单 ID / 单曲 ID
  id: 5144842535
  # 服务商：netease / qq / xiami / kugou / baidu
  server: netease
  # 类型：playlist / song
  type: playlist
  # 默认音量
  volume: 0.8
  # 是否自动播放
  mutex: true
  # 播放方式：list / random
  order: list
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Danmaku Page
# 弹幕留言页面
envelope: &v4_envelope
  enable: false
  line: 10 # 显示行数
  speed: 20 # 播放速度
  hover: true # 鼠标悬停暂停
  loop: true # 循环播放
  page: /message/ # 留言板页面 / message board page
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Brevity Page
# 即可短文
brevity: &v4_brevity
  enable: false
  home_mini: false
  music: false
  page: /essay/
  style: 1
  strip: 30
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Recent comments Page
# 最近评论页面
recent_comments: &v4_recent_comments
  enable: false
  limit: 50 # ⚠️waline 仅支持最大50条评论 / ⚠️waline only supports a maximum of 50 comments
  cache: 0.2 # 1 = 1天 / 1 = 1 day
  page: /recentcomments/ # 最近评论页面 / recent comments page
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Busuanzi
busuanzi: &v4_busuanzi false
# 0: Original / 1: Custom
# 0: 原版 / 1: 自定义版
busuanzi_use: 0
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Google Adsense
# 谷歌广告
google_adsense: &v4_google_adsense
  enable: false
  # Auto ads
  # 自动广告
  auto_ads: true
  # Page-level ads
  # 页面级广告
  enable_page_level_ads: true
  # Sidebar card ads
  # 侧边栏卡片广告
  aside_card: true
  # Post card ads
  # 文章卡片广告
  post_card: true
  # Post content ads
  # 文章内容广告
  post_content: true
  # Google Adsense js
  # 谷歌广告 js
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client: ca-pub-6338523842252061 # ca-pub-XXXXXXXXXXXXXX
  slot: # 4236388782
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# 非必要请勿修改
CDN: &v4_cdn
  internal: local # local / cdnjs / jsdelivr / unpkg / custom
  third_party: jsdelivr # cdnjs / jsdelivr / unpkg / custom
  version: true # 是否使用版本号
  custom_format: https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/${cdnjs_name}/${version}/${min_cdnjs_file}
  # 直接覆盖默认 CDN 链接（优先级最高）
  options:
    # algolia_search
    # aplayer_css
    # aplayer_js
    # artalk_css
    # artalk_js
    # blueimp_md5
    # busuanzi_js
    # chart_js
    # color_thief
    # fancyapps_css
    # fancyapps_ui
    # fontawesome
    # instantsearch
    # katex
    # katex_copytex
    # lazyload
    # medium_zoom
    # mermaid_js
    # meting_js
    # pace_js
    # pjax
    # qrcode
    # snackbar
    # swiper_css
    # swiper_js
    twikoo: https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twikoo/1.6.40/twikoo.all.min.js
    # typeit_js
    # valine
    # waline_css
    # waline_js
# --------------------------- end ---------------------------

# Solitude 4 public configuration view. The anchors above preserve the demo's
# historical values while the theme consumes the grouped 4.0 contract below.
config_version: 4

navigation:
  <<: *v4_nav
  rightside: *v4_rightside
  context_menu: *v4_right_menu
  keyboard: *v4_keyboard
  console: *v4_console

home:
  hero: *v4_hometop
  posts: *v4_index_post_list

sidebar: *v4_aside

article:
  defaults: *v4_post
  related: *v4_related_post
  copy: *v4_copy
  expiration: *v4_expire
  highlight: *v4_highlight
  katex: *v4_katex
  mermaid: *v4_mermaid
  chart: *v4_chart
  typeit: *v4_typeit
  lightbox:
    enable: *v4_lightbox
    provider: fancybox

pages:
  defaults: *v4_page
  error: *v4_errorpage
  brevity: *v4_brevity
  recent_comments: *v4_recent_comments
  message: *v4_envelope
  music: *v4_music

appearance:
  colors: *v4_theme_color
  mode: *v4_display_mode
  font: *v4_font
  loading: *v4_loading
  memorial: *v4_memorial

features:
  lazyload: *v4_lazyload
  translation: *v4_translate
  lure: *v4_lure
  wordcount: *v4_wordcount
  busuanzi:
    enable: *v4_busuanzi
    provider: official
  pwa: *v4_pwa
  open_graph: *v4_open_graph

integrations:
  comments:
    <<: *v4_comment
    providers:
      twikoo: *v4_twikoo
      waline: *v4_waline
      valine: *v4_valine
      artalk: *v4_artalk
      giscus: *v4_giscus
  search: *v4_search
  capsule: *v4_capsule
  meting_api: *v4_meting_api
  ads: *v4_google_adsense
  verification: *v4_verify_site

assets:
  cdn: *v4_cdn

extensions: *v4_extends
