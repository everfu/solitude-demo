cause:
  tip: 初衷
  title: 为什么建立这个网站？
  content:
    <br>这个网站是 Solitude 的在线演示，也是一个可直接参考的 <b>配置与内容样例</b>。你可以在这里了解主题的首页、文章、友链、装备、音乐和关于页如何协同工作。
    <br>
    站内教程聚焦 <b>真实的使用场景</b>：从外挂标签、侧边栏组件到第三方插件样式，尽量说明需要修改的位置、配置方式与最终效果。
    <br>
    如果这里的示例能让你的博客搭建过程更顺畅，这个演示站就完成了它最重要的使命。
    <br>

